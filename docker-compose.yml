services:
  wildvine-gateway:
    image: ${WILDVINE_IMAGE:-wildvine:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      WILDVINE_GATEWAY_TOKEN: ${WILDVINE_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${WILDVINE_CONFIG_DIR}:/home/node/.wildvine
      - ${WILDVINE_WORKSPACE_DIR}:/home/node/.wildvine/workspace
    ports:
      - "${WILDVINE_GATEWAY_PORT:-18789}:18789"
      - "${WILDVINE_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${WILDVINE_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  wildvine-cli:
    image: ${WILDVINE_IMAGE:-wildvine:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      WILDVINE_GATEWAY_TOKEN: ${WILDVINE_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${WILDVINE_CONFIG_DIR}:/home/node/.wildvine
      - ${WILDVINE_WORKSPACE_DIR}:/home/node/.wildvine/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
