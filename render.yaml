services:
  - type: web
    name: wildvine
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: WILDVINE_GATEWAY_PORT
        value: "8080"
      - key: WILDVINE_STATE_DIR
        value: /data/.wildvine
      - key: WILDVINE_WORKSPACE_DIR
        value: /data/workspace
      - key: WILDVINE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: wildvine-data
      mountPath: /data
      sizeGB: 1
